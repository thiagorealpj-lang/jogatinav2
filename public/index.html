<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020205">
  <title>Jogatina Dos Amigos - By C0kz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="bg-fx"></div>

  <!-- LOGIN -->
  <section id="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <h1 class="cyber grad-text">JOGATINA DOS AMIGOS</h1>
      <p class="cyber sub">// NEURAL INTERFACE BY C0KZ</p>

      <label class="lbl cyber" for="input-nick">TEU NICK</label>
      <input id="input-nick" maxlength="32" type="text" placeholder="Ex: ProGamer" required>

      <div id="pass-wrap" class="hidden">
        <label class="lbl cyber" for="input-pass">SENHA DO DONO</label>
        <input id="input-pass" type="password" placeholder="Senha do administrador principal">
      </div>

      <label class="lbl cyber">COR DO AVATAR</label>
      <div id="login-swatches" class="swatches"></div>

      <label class="check"><input id="chk-save" type="checkbox" checked> Sincronizar credenciais no cache neural</label>
      <div id="login-error" class="login-error hidden"></div>
      <button id="btn-login" class="btn primary big cyber" type="submit">INICIALIZAR CONEXÃO</button>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <div id="scrim" class="scrim hidden"></div>

    <aside id="sidebar">
      <div class="server-head">
        <div class="logo cyber"><span class="grad-text">JOGATINA</span><small>BY C0KZ</small></div>
        <button id="btn-invite" class="icon-btn" title="Copiar convite">🔗</button>
      </div>

      <div class="sidebar-scroll">
        <div class="cat"><span class="cyber">CANAIS DE TEXTO</span><button class="icon-btn admin-only hidden" data-add="text" title="Criar canal de texto">＋</button></div>
        <div id="list-text"></div>
        <div class="cat"><span class="cyber">CANAIS DE VOZ</span><button class="icon-btn admin-only hidden" data-add="voice" title="Criar canal de voz">＋</button></div>
        <div id="list-voice"></div>
      </div>

      <div id="voice-panel" class="hidden">
        <div class="vp-top">
          <div>
            <div class="vp-title cyber">● VOZ CONECTADA</div>
            <div class="vp-sub" id="vp-channel">—</div>
          </div>
          <div class="vp-actions">
            <button id="btn-screen" class="icon-btn" title="Compartilhar tela">📺</button>
            <button id="btn-leave-voice" class="icon-btn danger" title="Desconectar da voz">📞</button>
          </div>
        </div>
      </div>

      <div id="user-panel">
        <div id="up-avatar"></div>
        <div class="up-info" id="up-info"></div>
        <div class="up-actions">
          <button id="btn-mic" class="ctl-btn" title="Mutar microfone">🎤</button>
          <button id="btn-deaf" class="ctl-btn" title="Ensurdecer (mutar tudo)">🎧</button>
          <button id="btn-settings" class="ctl-btn" title="Configurações">⚙</button>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="btn-menu" class="icon-btn mobile-only" title="Canais">☰</button>
        <div class="tb-title"><span class="hash">#</span><span id="tb-name" class="cyber">geral</span></div>
        <div id="tb-topic" class="tb-topic"></div>
        <div class="tb-actions">
          <button id="btn-ai" class="tb-btn cyber">🤖 <span class="hide-sm">Assistente</span></button>
          <button id="btn-arcade" class="tb-btn cyber">🕹️ <span class="hide-sm">Arcade</span></button>
          <button id="btn-members" class="tb-btn cyber" title="Membros">👥</button>
          <button id="btn-logout" class="tb-btn danger cyber" title="Desconectar">⏻</button>
        </div>
      </header>

      <section id="stage" class="hidden">
        <div id="video-grid"></div>
      </section>

      <section id="chat">
        <div id="messages"></div>
      </section>
      <div id="typing"></div>

      <form id="composer" autocomplete="off">
        <div id="reply-bar" class="hidden"></div>
        <div class="composer-row">
          <button type="button" id="btn-emoji" class="icon-btn" title="Emojis">😊</button>
          <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Enviar mensagem..."></textarea>
          <button type="submit" class="send-btn cyber">Enviar</button>
        </div>
      </form>
    </main>

    <aside id="members">
      <div id="members-list"></div>
    </aside>
  </div>

  <!-- ASSISTENTE -->
  <div id="ai-panel" class="hidden">
    <div class="ai-head">
      <span class="cyber">🤖 SECRETÁRIO DO C0KZ</span>
      <span id="ai-badge" class="ai-badge cyber">LOCAL</span>
      <button id="ai-close" class="icon-btn">✖</button>
    </div>
    <div id="ai-box"></div>
    <form id="ai-form" class="ai-form">
      <input id="ai-input" type="text" maxlength="800" placeholder="Pergunte ao secretário..." autocomplete="off">
      <button class="send-btn cyber" type="submit">Perguntar</button>
    </form>
  </div>

  <!-- ARCADE -->
  <div id="arcade-modal" class="overlay hidden">
    <div class="modal arcade">
      <div class="modal-head">
        <h3 class="cyber">🕹️ ARCADE RETRÔ MULTIPLAYER</h3>
        <span class="pill cyber">Modo dupla: compartilhe a tela na sala!</span>
        <button id="arcade-close" class="btn danger cyber">Fechar ✖</button>
      </div>
      <div id="arcade-games" class="arcade-games"></div>
      <div id="arcade-screen" class="arcade-screen"><span class="cyber muted">[ ESCOLHA UM JOGO ACIMA PARA INICIALIZAR ]</span></div>
      <div class="arcade-foot">
        <button id="arcade-fs" class="btn ghost cyber">⛶ Tela cheia</button>
        <a id="arcade-open" class="btn ghost cyber hidden" target="_blank" rel="noopener noreferrer">↗ Abrir em nova aba</a>
      </div>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="ctx-menu" class="hidden"></div>
  <div id="emoji-pop" class="hidden"></div>
  <div id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
